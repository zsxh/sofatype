<!doctype html>
<!-- T15 · 手机远程输入页（FR-C1~C5/C7，决策 20：纯原生 HTML/CSS/JS，打进 APK assets 由 TV 服务下发，
     不引第三方框架与 CDN）。视觉规格 = PRD 第 6 章星夜青 Token（色值唯一来源），画板仅作布局参考。
     行为：点击编辑卡唤起系统键盘；每次编辑立即推送 input（全量文本，FR-C4）；删除移除末尾 1 字符；
     清空发 clear 同步 TV（FR-C5）；单次上限 200 字符（state.charLimit 下发），达限停输入并轻提示（FR-C7）。
     T16 · 上屏闭环（FR-C6 · 决策 10）：内容非空「上屏」可点，空内容置灰不可点；点击发 commit { text }，
     收到 TV 回执 committed { ok:true } 后草稿清空并轻提示「已上屏」；ok:false 提示失败可重试。
     T35 · 被顶替（FR-B11 / 决策 35）：收 replaced 后状态行「连接已被替换」，关闭后不被覆盖。
     T18 · 断连与退出清理（FR-B7/B8/C8 · PRD 5.3 · lead 拍板 2026-11-07）：
     ① state { url } 为配对成功后滚动新码地址（lead 拍板 A）：收到即 history.replaceState 更新
       地址栏（不落 localStorage / sessionStorage 等任何存储，隐私红线从严），刷新页面即持有效
       新码重新配对（FR-B8「支持刷新重连」）；token 逐个一次性不变。
     ② TV 退出远程（FR-B7 · PRD 5.3）：收 disconnect { reason:"tv-exit" } → 状态行「电视已退出远程输入」、
       输入禁用（编辑卡 / 删除 / 清空 / 上屏全禁），已收未上屏内容按丢弃处理。
     ②b R2 · 电视网络变化重建（PRD 5.3 行 2 · lead 批准 reason 取值增量）：收
       disconnect { reason:"network-rebuild" } → 状态行「连接已断开」+ 常驻 FR-C8 重连引导
       （检查同一 Wi-Fi 后重新扫码；重建后端口已换，刷新不可达，不给重注入口）。
     ③ 手机侧断连（FR-C8 / PRD 5.3）：WS 关闭（非被顶替 / 非电视退出 / 非配对被拒）→ 状态行
       「连接已断开」+ 「重连」入口（点击刷新页面，走地址栏中的有效新码重新配对）；重连失败
       （服务已停 / 换网不可达）→ FR-C8 引导文案（检查同一 Wi-Fi、重新扫码）。
     ③b R2 修复：配对被拒（state connected:false + 4001）的「配对失败…请重新扫码」文案
       在 onclose 后保持，不被断连覆盖（T14/T15 口径回归）。
     ④ 页面卸载（关闭 / 刷新前）best-effort 发送 disconnect { reason }（PRD 第 7 章 disconnect 双向）。
     JS 口径（微信内置浏览器初测 O-4）：ES5 语法 + 通用 API，无 URLSearchParams / 箭头函数 / 模板字符串；
     字符按 Unicode 码点处理（emoji 不拆散）；不使用任何持久化存储。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>远程输入 · sofatype</title>
  <style>
    /* 星夜青 Token（PRD 6.1） */
    :root {
      --bg: #06080C;
      --card: #12161E;
      --key: #1D242F;
      --key-hover: #242C39;
      --accent: #38BDF8;
      --accent-hover: #5BC9FA;
      --accent-text: #7DD3FC;
      --on-accent: #052330;
      --success: #34D399;
      --text-primary: #F2F6FB;
      --text-muted-55: rgba(232, 239, 246, .55);
      --text-muted-40: rgba(232, 239, 246, .4);
      --text-muted-35: rgba(232, 239, 246, .35);
      --border-accent-edit: rgba(56, 189, 248, .4);
      --border-accent: rgba(56, 189, 248, .5);
      --accent-wash: rgba(56, 189, 248, .16);
      --divider: rgba(255, 255, 255, .15);
      --tv-icon: rgba(56, 189, 248, .8);
      --text-secondary: #C9D4E2;
      --dot-idle: rgba(232, 239, 246, .35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* 基准 390×844 画布，水平居中；<390px 视口由 JS 等比缩放兜底（FR-C2「无滚动或最小滚动」，
       真实机型适配随 T19）；窄屏不横向滚动，宽屏两侧露底色（FR-C1 适配各类手机） */
    .stage {
      position: relative;
      width: 390px;
      height: 844px;
      margin: 0 auto;
      overflow: hidden;
      transform-origin: top left;
    }
    button { font-family: inherit; padding: 0; }

    /* 标题（画板 top 110 / left 24，28px w700） */
    .title {
      position: absolute;
      top: 110px;
      left: 24px;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 1px;
    }
    /* 状态行（评审决策：紧随标题下方左对齐）：绿点 + 已连接 · TV 名 ｜ 竖分隔线 ｜ 电视图标 + 说明 */
    .status-row {
      position: absolute;
      top: 164px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 342px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot-idle);
      flex: none;
    }
    .dot.connected { background: var(--success); }
    .status-text {
      font-size: 13px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-divider {
      width: 1px;
      height: 12px;
      background: var(--divider);
      flex: none;
    }
    .status-extra {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }
    .status-note {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }
    .status-note-text { font-size: 12px; color: var(--text-muted-55); }
    /* T18 · FR-C8 重连入口：断连后状态行内浮现（点击刷新页面，携地址栏有效新码重新配对） */
    .reconnect-btn {
      display: none;
      align-items: center;
      padding: 3px 12px;
      border: 1px solid var(--border-accent);
      border-radius: 9px;
      background: var(--accent-wash);
      color: var(--accent-text);
      font-size: 12px;
      cursor: pointer;
      flex: none;
    }
    .reconnect-btn.show { display: flex; }
    .reconnect-btn:active { background: var(--accent-hover); }

    /* 编辑卡（PRD 6.3 手机编辑卡 342×336 圆角 20，border rgba(56,189,248,.4) 1.5px） */
    .editor-card {
      position: absolute;
      top: 188px;
      left: 24px;
      width: 342px;
      height: 336px;
      background: var(--card);
      border: 1.5px solid var(--border-accent-edit);
      border-radius: 20px;
      padding: 20px;
      cursor: text;
    }
    .editor-content {
      font-size: 22px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 34px;
      word-break: break-word;
      white-space: pre-wrap;
      min-height: 34px;
      /* 200 字满卡时卡内滚动（卡固定 342×336，PRD 6.3；正文不溢出卡外） */
      max-height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* 末尾光标（画板：2×26px accent 圆角 1，与文字间隙 3px） */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 26px;
      margin-left: 3px;
      vertical-align: -5px;
      background: var(--accent);
      border-radius: 1px;
    }
    .char-counter {
      position: absolute;
      right: 16px;
      bottom: 14px;
      font-size: 12px;
      color: var(--text-muted-40);
      z-index: 1;
    }
    /* 达限轻提示（FR-C7）：卡内顶部居中浮现，不挤压布局 */
    .limit-hint {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 12px;
      border-radius: 9px;
      background: var(--key);
      border: 1px solid var(--border-accent);
      color: var(--accent-text);
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
      z-index: 2;
    }
    .limit-hint.show { opacity: 1; }
    /* 唤起系统键盘的透明输入层：铺满编辑卡，点击即聚焦（FR-C3）；
       font-size 16px 防 iOS 聚焦缩放；文字与插入符透明（内容由上方卡面渲染） */
    .ghost-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      padding: 0;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      opacity: 0;
      font-size: 16px;
      outline: none;
      resize: none;
    }

    /* 删除 / 清空（PRD 6.3 手机次级按钮 165×56 圆角 14 key 底 文字 15px） */
    .secondary-row {
      position: absolute;
      top: 552px;
      left: 24px;
      display: flex;
      gap: 12px;
    }
    .secondary-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 165px;
      height: 56px;
      border: 0;
      border-radius: 14px;
      background: var(--key);
      color: var(--text-secondary);
      font-size: 15px;
      cursor: pointer;
    }
    .secondary-btn:active { background: var(--key-hover); }

    /* 上屏主按钮（PRD 6.3 手机主按钮 342×56 圆角 16 accent 底 on-accent 17px w700）；
       T16 · FR-C6：内容为空置灰不可点（disabled = key 底 + muted 文字），非空恢复 accent 可点 */
    .primary-btn {
      position: absolute;
      top: 636px;
      left: 24px;
      width: 342px;
      height: 56px;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 6px;
      cursor: pointer;
    }
    .primary-btn:active { background: var(--accent-hover); }
    .primary-btn:disabled {
      background: var(--key);
      color: var(--text-muted-35);
      cursor: default;
    }

    /* 页脚 */
    .footer {
      position: absolute;
      top: 724px;
      left: 0;
      width: 390px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted-35);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="title">远程输入</div>

    <div class="status-row">
      <span class="dot" id="status-dot"></span>
      <span class="status-text" id="status-text" aria-live="polite">正在连接…</span>
      <button class="reconnect-btn" id="btn-reconnect" type="button" aria-label="重连">重 连</button>
      <span class="status-extra" id="status-extra">
        <span class="status-divider" aria-hidden="true"></span>
        <span class="status-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--tv-icon)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="13" rx="2"/><path d="M8.5 21h7"/><path d="M12 17.5V21"/></svg>
          <span class="status-note-text">文字将实时显示在电视上</span>
        </span>
      </span>
    </div>

    <div class="editor-card" id="editor-card">
      <div class="editor-content" id="editor-scroll"><span id="content-text"></span><span class="cursor" aria-hidden="true"></span></div>
      <div class="char-counter" id="char-counter">0 / 200</div>
      <div class="limit-hint" id="limit-hint" role="status" aria-live="polite"></div>
      <textarea class="ghost-input" id="ghost-input" rows="3" aria-label="远程输入内容"
                autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    </div>

    <div class="secondary-row">
      <button class="secondary-btn" id="btn-delete" aria-label="删除一个字符">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M8.5 5h11A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-11L3 12z"/><path d="M11.5 9.5l5 5"/><path d="M16.5 9.5l-5 5"/></svg>
        删除
      </button>
      <button class="secondary-btn" id="btn-clear" aria-label="清空全部内容">清空</button>
    </div>

    <button class="primary-btn" id="btn-commit" aria-label="上屏" disabled>上 屏</button>

    <div class="footer">同一 Wi-Fi 下与电视保持连接</div>
  </div>

  <script>
  (function () {
    'use strict';
    var LIMIT_DEFAULT = 200;
    var charLimit = LIMIT_DEFAULT;
    var text = ''; // 当前编辑内容（全量，码点安全）
    var gotState = false;
    var replaced = false; // T35：本连接已被新设备顶替（决定关闭后的状态行文案）
    var rejected = false; // R2 修复：配对被拒（connected:false + 4001）——onclose 后保持「重新扫码」引导文案不被断连覆盖
    var exited = false; // T18：电视已退出远程输入（决定关闭后的状态行文案与输入禁用）
    var networkChanged = false; // R2：电视网络变化重建（disconnect reason=network-rebuild）——onclose 后保持 FR-C8 重新扫码引导
    var ws = null;
    var hintTimer = null;

    function byId(id) { return document.getElementById(id); }
    var contentEl = byId('content-text');
    var scrollEl = byId('editor-scroll'); // 卡内滚动容器（.editor-content div；inline span 无 scrollTop）
    var counterEl = byId('char-counter');
    var hintEl = byId('limit-hint');
    var inputEl = byId('ghost-input');
    var deleteBtn = byId('btn-delete');
    var clearBtn = byId('btn-clear');
    var commitBtn = byId('btn-commit');
    var reconnectBtn = byId('btn-reconnect');
    var dotEl = byId('status-dot');
    var statusEl = byId('status-text');
    var extraEl = byId('status-extra');
    var cardEl = byId('editor-card');

    /* 按 Unicode 码点拆分（emoji 等增补字符不拆散；Array.from 缺失时退回正则） */
    function toChars(s) {
      if (typeof Array.from === 'function') return Array.from(s);
      return s.match(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[^\uD800-\uDFFF]/g) || [];
    }
    function codePointLength(s) { return toChars(s).length; }
    function clampToLimit(s) { return toChars(s).slice(0, charLimit).join(''); }

    /* 从 URL query 取一次性 token（不使用 URLSearchParams，兼容旧内核） */
    function getToken() {
      var query = location.search.substring(1);
      if (!query) return '';
      var pairs = query.split('&');
      for (var i = 0; i < pairs.length; i++) {
        var kv = pairs[i].split('=');
        if (kv[0] === 'token') {
          var value = kv.slice(1).join('=') || '';
          try { return decodeURIComponent(value); } catch (e) { return value; }
        }
      }
      return '';
    }

    function render() {
      contentEl.textContent = text;
      counterEl.textContent = codePointLength(text) + ' / ' + charLimit;
      // T16 · FR-C6：空内容上屏置灰不可点；非空恢复可点（disabled 元素天然不触发 click）
      commitBtn.disabled = codePointLength(text) === 0;
      // 卡内滚动跟随末尾（滚动容器 = .editor-content；末字符与光标保持可见）
      scrollEl.scrollTop = scrollEl.scrollHeight;
    }

    /* FR-C4：每次编辑立即推送（input 全量文本）；断连期间静默（重连随 T18） */
    function pushInput() {
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'input', text: text }));
      }
    }
    function pushClear() {
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'clear' }));
      }
    }

    /* FR-C7 轻提示：浮现约 1.5s 后淡出；sticky=true 时不自动淡出（R2 · FR-C8 重连引导常驻），
       由 setConnected / 新提示清除 */
    function showHint(message, sticky) {
      hintEl.textContent = message;
      hintEl.classList.add('show');
      if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
      if (!sticky) {
        hintTimer = setTimeout(function () { hintEl.classList.remove('show'); }, 1500);
      }
    }

    /* FR-C3：点击卡片任意位置唤起系统键盘（透明输入层已铺满卡片，此处兜底聚焦）；
       T18：电视已退出后输入禁用，点击不再聚焦 */
    cardEl.addEventListener('click', function () {
      if (exited) { return; }
      inputEl.focus();
    });

    /* 编辑（FR-C3/C4/C7）：立即推送全量文本；超限截断并轻提示 */
    inputEl.addEventListener('input', function () {
      var raw = inputEl.value;
      var clamped = clampToLimit(raw);
      if (codePointLength(raw) > charLimit) {
        showHint('最多 ' + charLimit + ' 字');
      }
      if (raw !== clamped) { inputEl.value = clamped; }
      text = clamped;
      render();
      pushInput();
    });

    /* FR-C5：删除移除末尾 1 个字符（码点安全），同步推送 input */
    deleteBtn.addEventListener('click', function () {
      if (!text) { return; }
      var chars = toChars(text);
      chars.pop();
      text = chars.join('');
      inputEl.value = text;
      render();
      pushInput();
    });

    /* FR-C5：清空全部内容，同步 clear 消息（TV 端同时移除，无需二次确认） */
    clearBtn.addEventListener('click', function () {
      if (!text) { return; }
      text = '';
      inputEl.value = '';
      render();
      pushClear();
    });

    /* T16 · FR-C6 上屏：发 commit { text }，写入结果由 TV 回执 committed { ok } 确认；
       空内容（置灰态兜底）不发送；连接已断时仅即时反馈（断连提示与重连随 T18），
       草稿保留，重连后可再点。 */
    commitBtn.addEventListener('click', function () {
      if (!text) { return; }
      if (!ws || ws.readyState !== 1) { showHint('未连接，无法上屏'); return; }
      ws.send(JSON.stringify({ type: 'commit', text: text }));
    });

    function setConnected(tvName) {
      dotEl.classList.add('connected');
      statusEl.textContent = '已连接 · ' + tvName;
      reconnectBtn.classList.remove('show');
      extraEl.style.display = '';
      hintEl.classList.remove('show'); // 清除常驻重连引导（R2）
    }
    function setRejected() {
      /* T14/T15 口径：配对被拒引导重新扫码；R2 修复——rejected 标记使该文案在 onclose 后保持 */
      rejected = true;
      dotEl.classList.remove('connected');
      statusEl.textContent = '配对失败：token 无效或已使用，请重新扫码';
      extraEl.style.display = 'none';
      reconnectBtn.classList.remove('show');
    }
    /* T35 · FR-B11 / 决策 35：连接被新设备顶替——旧手机端提示并进入未连接态（重连随 T18） */
    function setReplaced() {
      replaced = true;
      dotEl.classList.remove('connected');
      statusEl.textContent = '连接已被替换';
      extraEl.style.display = 'none';
      showHint('连接已被另一台设备替换');
    }
    /* T18 · FR-B7 / PRD 5.3：电视端退出远程——提示并禁输入（编辑卡 / 删除 / 清空 / 上屏全禁），
       已收未上屏内容按丢弃处理；无重连入口（服务已随退出停止） */
    function setTvExited() {
      exited = true;
      dotEl.classList.remove('connected');
      statusEl.textContent = '电视已退出远程输入';
      extraEl.style.display = 'none';
      reconnectBtn.classList.remove('show');
      inputEl.disabled = true;
      deleteBtn.disabled = true;
      clearBtn.disabled = true;
      commitBtn.disabled = true;
    }
    /* T18 · FR-C8 / PRD 5.3：手机侧断连（页面被顶替与电视退出之外）——断连提示 + 「重连」入口；
       重连 = 刷新页面，携地址栏中的滚动新码重新配对 */
    function setDisconnected() {
      dotEl.classList.remove('connected');
      statusEl.textContent = '连接已断开';
      extraEl.style.display = 'none';
      reconnectBtn.classList.add('show');
    }
    /* R2 · PRD 5.3 行 2 / FR-C8：电视端网络变化重建（disconnect reason=network-rebuild）——
       状态行「连接已断开」+ 常驻重连引导（检查同一 Wi-Fi 后重新扫码）。重建后服务端口已更换，
       刷新本页不可达，故不给「重连」入口，引导重新扫码（FR-C8 口径） */
    function setNetworkChanged() {
      networkChanged = true;
      dotEl.classList.remove('connected');
      statusEl.textContent = '连接已断开';
      extraEl.style.display = 'none';
      reconnectBtn.classList.remove('show');
      showHint('电视网络已变化，请检查同一 Wi-Fi 后重新扫码', true);
    }

    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = function () {
      ws.send(JSON.stringify({ type: 'hello', token: getToken(), deviceName: 'browser' }));
    };
    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (!msg || !msg.type) { return; }
      /* T16 · FR-B6/C6：TV 上屏回执——成功：草稿清空 + 提示「已上屏」（决策 10 / R-4）；
         失败：草稿保留，提示可重试（TV 端无焦点输入框等写入失败场景） */
      if (msg.type === 'committed') {
        if (msg.ok) {
          text = '';
          inputEl.value = '';
          render();
          showHint('已上屏');
        } else {
          showHint('上屏失败，请重试');
        }
        return;
      }
      if (msg.type === 'replaced') {
        /* T35 · FR-B11 / 决策 35：连接被新设备顶替（TV 随后按 4002 关闭本连接） */
        gotState = true;
        setReplaced();
        return;
      }
      if (msg.type === 'disconnect') {
        /* T18 · PRD 5.3 / lead R2 批准的 reason 取值增量：tv-exit = 电视退出远程（输入禁用，
           无重连）；network-rebuild = 电视网络变化重建（「连接已断开」+ FR-C8 重新扫码引导）。
           已收未上屏内容按丢弃处理 */
        gotState = true;
        if (msg.reason === 'tv-exit') {
          setTvExited();
        } else {
          setNetworkChanged();
        }
        return;
      }
      if (msg.type !== 'state') { return; }
      gotState = true;
      if (msg.connected) {
        var limit = Number(msg.charLimit);
        charLimit = (limit > 0 ? limit : LIMIT_DEFAULT);
        text = clampToLimit(text);
        inputEl.value = text;
        render();
        setConnected(msg.tvName);
        /* T18 · FR-B8 刷新重连（lead 拍板 A）：state.url = 配对成功后滚动签发的有效新码地址；
           取其中的 token 原位更新地址栏查询串（保留页面自身访问来源的 host——走查 redir /
           主机名别名场景与真实 Wi-Fi 同源可用；不落任何存储），刷新页面即持有效码重新配对。
           token 逐个一次性不变 */
        if (msg.url) {
          var idx = msg.url.indexOf('token=');
          if (idx >= 0) {
            var rolled = msg.url.substring(idx + 'token='.length);
            try { history.replaceState(null, '', '/?token=' + rolled); } catch (e2) { /* 旧内核不支持时保持原地址 */ }
          }
        }
      } else {
        setRejected();
      }
    };
    ws.onclose = function (ev) {
      /* T18 · FR-C8：关闭后按成因分派状态行——电视退出（disconnect 已达）/ 被顶替（replaced 已达）/
         配对被拒（R2 修复：rejected，保持「重新扫码」引导不被覆盖）各自保持既有文案；
         已配对连接意外断开（手机断网 / TV 进程被杀）→ 断连提示 + 重连入口；
         未完成配对即断开 → FR-C8 引导（检查同一 Wi-Fi、重新扫码；与 onerror 同文案，
         两个事件都触发时最终文案确定） */
      if (exited || replaced || rejected || networkChanged) {
        return; // setTvExited / setReplaced / setRejected / setNetworkChanged 已定文案，不被关闭事件覆盖
      }
      if (gotState) {
        setDisconnected();
      } else {
        dotEl.classList.remove('connected');
        statusEl.textContent = '连接失败，请检查与电视在同一 Wi-Fi 后重新扫码';
        extraEl.style.display = 'none';
      }
    };
    ws.onerror = function () {
      /* T18 · FR-C8 重连失败引导：服务已停 / 换网不可达时，刷新重连无法到达——给重新扫码引导 */
      if (!gotState) {
        statusEl.textContent = '连接失败，请检查与电视在同一 Wi-Fi 后重新扫码';
      }
    };

    /* T18 · FR-C8 重连入口：刷新页面（携地址栏滚动新码重新走配对） */
    reconnectBtn.addEventListener('click', function () { location.reload(); });

    /* T18 · PRD 第 7 章 disconnect 双向：页面关闭 / 刷新前 best-effort 通知电视（尽力发送，
       发送后连接即随页面卸载关闭）；不做任何持久化 */
    window.addEventListener('pagehide', function () {
      if (ws && ws.readyState === 1) {
        try { ws.send(JSON.stringify({ type: 'disconnect', reason: 'page-unload' })); } catch (e3) { /* 连接已不可用 */ }
      }
    });

    /* <390px 视口等比缩放兜底：360px 常见安卓视口下整卡缩放，不横向滚动、编辑卡不裁边
       （FR-C2「无滚动或最小滚动」最小实现；真实机型适配随 T19） */
    function fitStage() {
      var stage = document.querySelector('.stage');
      var scale = Math.min(1, document.documentElement.clientWidth / 390);
      stage.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    render();
  })();
  </script>
</body>
</html>
