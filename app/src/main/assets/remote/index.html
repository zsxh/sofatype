<!doctype html>
<!-- T15 · 手机远程输入页（FR-C1~C5/C7，决策 20：纯原生 HTML/CSS/JS，打进 APK assets 由 TV 服务下发，
     不引第三方框架与 CDN）。视觉规格 = PRD 第 6 章星夜青 Token（色值唯一来源），画板仅作布局参考。
     行为：点击编辑卡唤起系统键盘；每次编辑立即推送 input（全量文本，FR-C4）；删除移除末尾 1 字符；
     清空发 clear 同步 TV（FR-C5）；单次上限 200 字符（state.charLimit 下发），达限停输入并轻提示（FR-C7）。
     T16 · 上屏闭环（FR-C6 · 决策 10）：内容非空「上屏」可点，空内容置灰不可点；点击发 commit { text }，
     收到 TV 回执 committed { ok:true } 后草稿清空并轻提示「已上屏」；ok:false 提示失败可重试。
     T70 · 上屏保活（FR-C6 · 决策 59 修订决策 10 / R-4）：TV 端上屏成功不再拆会话——
     committed { ok:true } 后草稿清空提示「已上屏」，WS 连接保持、textarea 保持可输入态，
     可直接继续编辑（input 照常实时推送）并再次上屏；ok:false 提示失败可重试不变。
     本页 JS 行为无改动：保活由 TV 端保持连接承载，本页既有「清草稿 + 提示 + 输入态不关」实现即满足。
     T35 · 被顶替（FR-B11 / 决策 35）：收 replaced 后状态行「连接已被替换」，关闭后不被覆盖。
     T72 · 连接代号（决策 61）：① 类型判定在手机端完成、随 hello 上报 deviceType
     （微信→苹果→安卓→浏览器命中即停，UA 正则按序匹配）；② 首访生成随机 UUID 存 localStorage
     （键 sofatype_remote_device_key，只存客户端自生成 UUID——无身份关联、不上云，隐私红线
     决策 61 口径；localStorage 不可用时（隐私模式）每次连接临时生成），随每次 hello 上报
     deviceKey；③ 「远程输入」标题后连接代号胶囊（[官方标 icon][类型]设备[两位序号]，画板 8）：
     icon 为决策 61 四类型官方标（微信双气泡 #07C160 + 白眼 / 苹果 #94A3B8 / 安卓机器人头
     #3DDC84 / 浏览器地球 #A78BFA 品类无官方标保留通用图形），收到 state 即覆盖显示
     （state 为代号唯一事实源，本页不本地缓存代号），无 clientCode / 未连接态隐藏胶囊；
     FR-C2 状态行「已连接 · TV名」保持不变（决策 61）。
     官方标矢量来源：微信 = sgnewres.wechat.com 官方资源（newsroom 品牌页引用）、
     苹果 = www.apple.com 官方导航 SVG、安卓 = google/material-design-icons 官方仓库
     Material Symbols android 字形（均原样 pathData 转换，不手描）；浏览器地球为通用图形。
     T24 · 未连接引导页（FR-C9）：hello 被拒（state connected:false + 4001，token 缺失 / 无效 /
     已使用 / 会话超期遗留）→ 整页未连接引导呈现，提示重新扫码；输入面禁用（引导页为唯一内容面）。
     FR-C8 断连 / 重连 / 被顶替 / 电视退出路径（T18/T35 既有口径）不改动；token 无独立 TTL
     （决策 35 滚动签发、逐 token 一次性，服务停止即清空），「超时」即校验失败走同一被拒路径。
     T18 · 断连与退出清理（FR-B7/B8/C8 · PRD 5.3 · lead 拍板 2026-11-07）：
     ① state { url } 为配对成功后滚动新码地址（lead 拍板 A）：收到即 history.replaceState 更新
       地址栏（不落 localStorage / sessionStorage 等任何存储，隐私红线从严），刷新页面即持有效
       新码重新配对（FR-B8「支持刷新重连」）；token 逐个一次性不变。
     ② TV 退出远程（FR-B7 · PRD 5.3）：收 disconnect { reason:"tv-exit" } → 状态行「电视已退出远程输入」、
       输入禁用（编辑卡 / 删除 / 清空 / 上屏全禁），已收未上屏内容按丢弃处理。
     ②b R2 · 电视网络变化重建（PRD 5.3 行 2 · lead 批准 reason 取值增量）：收
       disconnect { reason:"network-rebuild" } → 状态行「连接已断开」+ 常驻 FR-C8 重连引导
       （检查同一 Wi-Fi 后重新扫码；重建后端口已换，刷新不可达，不给重注入口）。
     ③ 手机侧断连（FR-C8 / PRD 5.3）：WS 关闭（非被顶替 / 非电视退出 / 非配对被拒）→ 状态行
       「连接已断开」+ 「重连」入口（点击刷新页面，走地址栏中的有效新码重新配对）；重连失败
       （服务已停 / 换网不可达）→ FR-C8 引导文案（检查同一 Wi-Fi、重新扫码）。
     ③b R2 修复：配对被拒（state connected:false + 4001）的「配对失败…请重新扫码」文案
       在 onclose 后保持，不被断连覆盖（T14/T15 口径回归）。
     ④ 页面卸载（关闭 / 刷新前）best-effort 发送 disconnect { reason }（PRD 第 7 章 disconnect 双向）。
     T69 · 编辑面原生可见（FR-C3 长按粘贴修复）：废止「透明输入层 + 自绘回显」双层面——textarea
       作为唯一编辑面原生可见（长按出系统粘贴/选择菜单、光标可点选定位文字中间），原显示层降级为
       隐藏镜像，仅用于未聚焦态末尾假光标定位（聚焦后隐藏、原生插入符接管）；推送/钳制/清空口径不变。
     JS 口径（微信内置浏览器初测 O-4）：ES5 语法 + 通用 API，无 URLSearchParams / 箭头函数 / 模板字符串；
     字符按 Unicode 码点处理（emoji 不拆散）；不使用任何持久化存储。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>远程输入 · sofatype</title>
  <style>
    /* 星夜青 Token（PRD 6.1） */
    :root {
      --bg: #06080C;
      --card: #12161E;
      --card-border: rgba(255, 255, 255, .08);
      --key: #1D242F;
      --key-hover: #242C39;
      --accent: #38BDF8;
      --accent-hover: #5BC9FA;
      --accent-text: #7DD3FC;
      --on-accent: #052330;
      --success: #34D399;
      --text-primary: #F2F6FB;
      --text-muted-55: rgba(232, 239, 246, .55);
      --text-muted-40: rgba(232, 239, 246, .4);
      --text-muted-35: rgba(232, 239, 246, .35);
      --border-accent-edit: rgba(56, 189, 248, .4);
      --border-accent: rgba(56, 189, 248, .5);
      --accent-wash: rgba(56, 189, 248, .16);
      --divider: rgba(255, 255, 255, .15);
      --tv-icon: rgba(56, 189, 248, .8);
      --text-secondary: #C9D4E2;
      --dot-idle: rgba(232, 239, 246, .35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* 基准 390×844 画布，水平居中；<390px 视口由 JS 等比缩放兜底（FR-C2「无滚动或最小滚动」，
       真实机型适配随 T19）；窄屏不横向滚动，宽屏两侧露底色（FR-C1 适配各类手机） */
    .stage {
      position: relative;
      width: 390px;
      height: 844px;
      margin: 0 auto;
      overflow: hidden;
      transform-origin: top left;
    }
    button { font-family: inherit; padding: 0; }

    /* 标题（画板 top 110 / left 24，28px w700）；T72 · 决策 61：行内 flex 承载「远程输入」+
       连接代号胶囊（画板 8：标题后 gap 10px） */
    .title-row {
      position: absolute;
      top: 110px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 1px;
    }
    /* T72 · 决策 61 连接代号胶囊（画板 8）：padding 2px 10px、圆角 8、icon 18、
       gap 5px；icon 外文字纯白 #F2F6FB（类型 14px w600 / 序号 15px w700 tabular-nums）。
       icon 色为决策 61 锁定的官方标固定色（非主题 Token，同二维码功能性用色口径） */
    .code-pill {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 2px 10px;
      background: rgba(232, 239, 246, .10);
      border-radius: 8px;
    }
    .code-pill.show { display: inline-flex; }
    .code-pill svg { display: block; flex: none; }
    .code-label {
      font-size: 14px;
      font-weight: 600;
      color: #F2F6FB;
      white-space: nowrap;
    }
    .code-number {
      font-size: 15px;
      font-weight: 700;
      color: #F2F6FB;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    /* 状态行（评审决策：紧随标题下方左对齐）：绿点 + 已连接 · TV 名 ｜ 竖分隔线 ｜ 电视图标 + 说明 */
    .status-row {
      position: absolute;
      top: 164px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 342px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot-idle);
      flex: none;
    }
    .dot.connected { background: var(--success); }
    .status-text {
      font-size: 13px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-divider {
      width: 1px;
      height: 12px;
      background: var(--divider);
      flex: none;
    }
    .status-extra {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }
    .status-note {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }
    .status-note-text { font-size: 12px; color: var(--text-muted-55); }
    /* T18 · FR-C8 重连入口：断连后状态行内浮现（点击刷新页面，携地址栏有效新码重新配对） */
    .reconnect-btn {
      display: none;
      align-items: center;
      padding: 3px 12px;
      border: 1px solid var(--border-accent);
      border-radius: 9px;
      background: var(--accent-wash);
      color: var(--accent-text);
      font-size: 12px;
      cursor: pointer;
      flex: none;
    }
    .reconnect-btn.show { display: flex; }
    .reconnect-btn:active { background: var(--accent-hover); }

    /* 编辑卡（PRD 6.3 手机编辑卡 342×336 圆角 20，border rgba(56,189,248,.4) 1.5px） */
    .editor-card {
      position: absolute;
      top: 188px;
      left: 24px;
      width: 342px;
      height: 336px;
      background: var(--card);
      border: 1.5px solid var(--border-accent-edit);
      border-radius: 20px;
      padding: 20px;
      cursor: text;
    }
    /* T69 · 编辑内容镜像：不可见（visibility:hidden 保持排版），仅用于测量文字末尾坐标、
       定位未聚焦假光标；字体规格与 .ghost-input 逐项一致（22px/34px w500、同 word-break、
       同内容宽 299px），测量才对位。滚动随输入层同步（positionCursor） */
    .editor-content {
      visibility: hidden;
      font-size: 22px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 34px;
      word-break: break-word;
      white-space: pre-wrap;
      min-height: 34px;
      /* 200 字满卡时镜像与输入层同步滚动（卡固定 342×336，PRD 6.3） */
      max-height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* 镜像内联末尾标记（T69）：JS 读其坐标落到 .fake-cursor 呈现；规格 = 画板 2×26 accent 圆角 1、
       与文字间隙 3px（margin-left 承担） */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 26px;
      margin-left: 3px;
      vertical-align: -5px;
      background: var(--accent);
      border-radius: 1px;
    }
    /* T69 · 未聚焦态末尾光标：绝对定位落在镜像标记坐标；聚焦后隐藏让位原生插入符 */
    .fake-cursor {
      position: absolute;
      width: 2px;
      height: 26px;
      background: var(--accent);
      border-radius: 1px;
      pointer-events: none;
      z-index: 1;
    }
    .char-counter {
      position: absolute;
      right: 16px;
      bottom: 14px;
      font-size: 12px;
      color: var(--text-muted-40);
      z-index: 1;
      /* T69：计数为展示件，不拦截输入层点击/长按 */
      pointer-events: none;
    }
    /* 达限轻提示（FR-C7）：卡内顶部居中浮现，不挤压布局 */
    .limit-hint {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 12px;
      border-radius: 9px;
      background: var(--key);
      border: 1px solid var(--border-accent);
      color: var(--accent-text);
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
      z-index: 2;
    }
    .limit-hint.show { opacity: 1; }
    /* T69 · 输入层（FR-C3）：铺满编辑卡的唯一编辑面，原生可见——长按出系统粘贴/选择菜单、
       光标可点选定位。视觉按 PRD 6.3 复刻：22px/34px w500、text-primary 文字、accent 插入符、
       内边距 20px 与卡一致；font-size ≥16px 防 iOS 聚焦缩放；表单控件不继承字体，显式 inherit */
    .ghost-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      padding: 20px;
      background: transparent;
      color: var(--text-primary);
      caret-color: var(--accent);
      font-family: inherit;
      font-size: 22px;
      font-weight: 500;
      line-height: 34px;
      word-break: break-word;
      outline: none;
      resize: none;
      -webkit-overflow-scrolling: touch;
    }

    /* 删除 / 清空（PRD 6.3 手机次级按钮 165×56 圆角 14 key 底 文字 15px） */
    .secondary-row {
      position: absolute;
      top: 552px;
      left: 24px;
      display: flex;
      gap: 12px;
    }
    .secondary-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 165px;
      height: 56px;
      border: 0;
      border-radius: 14px;
      background: var(--key);
      color: var(--text-secondary);
      font-size: 15px;
      cursor: pointer;
    }
    .secondary-btn:active { background: var(--key-hover); }

    /* 上屏主按钮（PRD 6.3 手机主按钮 342×56 圆角 16 accent 底 on-accent 17px w700）；
       T16 · FR-C6：内容为空置灰不可点（disabled = key 底 + muted 文字），非空恢复 accent 可点 */
    .primary-btn {
      position: absolute;
      top: 636px;
      left: 24px;
      width: 342px;
      height: 56px;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 6px;
      cursor: pointer;
    }
    .primary-btn:active { background: var(--accent-hover); }
    .primary-btn:disabled {
      background: var(--key);
      color: var(--text-muted-35);
      cursor: default;
    }

    /* 页脚 */
    .footer {
      position: absolute;
      top: 724px;
      left: 0;
      width: 390px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted-35);
    }

    /* T24 · FR-C9 未连接引导页：配对被拒后整页呈现（覆盖编辑界面），提示重新扫码。
       色值全取 PRD 6.1 Token：页面底 --bg、卡片 --card + 描边 rgba(255,255,255,.08)（6.1 卡片规格）、
       未连接灰点 --dot-idle（6.4 状态色）；非交互页面（无按钮，无新增交互元素）。 */
    .guide {
      position: absolute;
      top: 0;
      left: 0;
      width: 390px;
      height: 844px;
      background: var(--bg);
      z-index: 10;
      display: none;
    }
    .guide.show { display: block; }
    .guide-status {
      position: absolute;
      top: 164px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 342px;
    }
    .guide-status-text {
      font-size: 13px;
      color: var(--text-primary);
    }
    .guide-title {
      position: absolute;
      top: 196px;
      left: 24px;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 1px;
    }
    .guide-card {
      position: absolute;
      top: 264px;
      left: 24px;
      width: 342px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 20px;
    }
    .guide-headline {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .guide-body {
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 22px;
      color: var(--text-muted-55);
    }
    .guide-step {
      margin: 0;
      font-size: 15px;
      line-height: 30px;
      color: var(--text-secondary);
    }
    .guide-footer {
      position: absolute;
      top: 724px;
      left: 0;
      width: 390px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted-35);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="title-row">
      <div class="title">远程输入</div>
      <!-- T72 · 决策 61 连接代号胶囊：收到 state.clientCode 即覆盖显示（不本地缓存），无则隐藏 -->
      <span class="code-pill" id="code-pill" aria-live="polite"></span>
    </div>

    <div class="status-row">
      <span class="dot" id="status-dot"></span>
      <span class="status-text" id="status-text" aria-live="polite">正在连接…</span>
      <button class="reconnect-btn" id="btn-reconnect" type="button" aria-label="重连">重 连</button>
      <span class="status-extra" id="status-extra">
        <span class="status-divider" aria-hidden="true"></span>
        <span class="status-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--tv-icon)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="13" rx="2"/><path d="M8.5 21h7"/><path d="M12 17.5V21"/></svg>
          <span class="status-note-text">文字将实时显示在电视上</span>
        </span>
      </span>
    </div>

    <div class="editor-card" id="editor-card">
      <div class="editor-content" id="editor-scroll"><span id="content-text"></span><span class="cursor" id="cursor-marker" aria-hidden="true"></span></div>
      <span class="fake-cursor" id="fake-cursor" aria-hidden="true"></span>
      <div class="char-counter" id="char-counter">0 / 200</div>
      <div class="limit-hint" id="limit-hint" role="status" aria-live="polite"></div>
      <textarea class="ghost-input" id="ghost-input" rows="3" aria-label="远程输入内容"
                autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    </div>

    <div class="secondary-row">
      <button class="secondary-btn" id="btn-delete" aria-label="删除一个字符">

    /* T72 · 决策 61：保号键 = 首访生成随机 UUID 存 localStorage（只存自生成 UUID，无身份关联）；

    /* T72 · 决策 61：连接代号胶囊（收到 state 即覆盖，不本地缓存代号） */

    function setReplaced() {

      statusEl.textContent = '连接已被替换';

    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = function () {
      /* T72 · 决策 61：hello 增 deviceType（手机端判定）与 deviceKey（保号键） */
      ws.send(JSON.stringify({
        type: 'hello',
        token: getToken(),
        deviceName: 'browser',
        deviceType: deviceType,
        deviceKey: getDeviceKey()
      }));
    };
    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (!msg || !msg.type) { return; }
      /* T16 · FR-B6/C6：TV 上屏回执——成功：草稿清空 + 提示「已上屏」（决策 59 修订决策 10 / R-4：
         TV 端不停服，连接保持，清空后可继续编辑再次上屏）；
         失败：草稿保留，提示可重试（TV 端无焦点输入框等写入失败场景） */
      if (msg.type === 'committed') {
        if (msg.ok) {
          text = '';
          render();
          showHint('已上屏');
        } else {
          showHint('上屏失败，请重试');
        }
        return;
      }
      if (msg.type === 'replaced') {
        /* T35 · FR-B11 / 决策 35：连接被新设备顶替（TV 随后按 4002 关闭本连接） */
        gotState = true;
        setReplaced();
        return;
      }
      if (msg.type === 'disconnect') {
        /* T18 · PRD 5.3 / lead R2 批准的 reason 取值增量：tv-exit = 电视退出远程（输入禁用，
           无重连）；network-rebuild = 电视网络变化重建（「连接已断开」+ FR-C8 重新扫码引导）。
           已收未上屏内容按丢弃处理 */
        gotState = true;
        if (msg.reason === 'tv-exit') {
          setTvExited();
        } else {
          setNetworkChanged();
        }
        return;
      }
      if (msg.type !== 'state') { return; }
      gotState = true;
      if (msg.connected) {
        var limit = Number(msg.charLimit);
        charLimit = (limit > 0 ? limit : LIMIT_DEFAULT);
        text = clampToLimit(text);
        inputEl.value = text;
        render();
        setConnected(msg.tvName);
        /* T72 · 决策 61：state 为代号唯一事实源——收到 clientCode 即覆盖胶囊显示
           （本页不本地缓存代号）；未携带（旧 TV 构建）时隐藏胶囊 */
        showClientCode(msg.clientCode);
        /* T18 · FR-B8 刷新重连（lead 拍板 A）：state.url = 配对成功后滚动签发的有效新码地址；
           取其中的 token 原位更新地址栏查询串（保留页面自身访问来源的 host——走查 redir /
           主机名别名场景与真实 Wi-Fi 同源可用；不落任何存储），刷新页面即持有效码重新配对。
           token 逐个一次性不变 */
        if (msg.url) {
          var idx = msg.url.indexOf('token=');
          if (idx >= 0) {
            var rolled = msg.url.substring(idx + 'token='.length);
            try { history.replaceState(null, '', '/?token=' + rolled); } catch (e2) { /* 旧内核不支持时保持原地址 */ }
          }
        }
      } else {
        setRejected();
      }
    };
    ws.onclose = function (ev) {
      /* T18 · FR-C8：关闭后按成因分派状态行——电视退出（disconnect 已达）/ 被顶替（replaced 已达）/
         配对被拒（R2 修复：rejected，保持「重新扫码」引导不被覆盖）各自保持既有文案；
         已配对连接意外断开（手机断网 / TV 进程被杀）→ 断连提示 + 重连入口；
         未完成配对即断开 → FR-C8 引导（检查同一 Wi-Fi、重新扫码；与 onerror 同文案，
         两个事件都触发时最终文案确定） */
      if (exited || replaced || rejected || networkChanged) {
        return; // setTvExited / setReplaced / setRejected / setNetworkChanged 已定文案，不被关闭事件覆盖
      }
      if (gotState) {
        setDisconnected();
      } else {
        dotEl.classList.remove('connected');
        statusEl.textContent = '连接失败，请检查与电视在同一 Wi-Fi 后重新扫码';
        extraEl.style.display = 'none';
      }
    };
    ws.onerror = function () {
      /* T18 · FR-C8 重连失败引导：服务已停 / 换网不可达时，刷新重连无法到达——给重新扫码引导 */
      if (!gotState) {
        statusEl.textContent = '连接失败，请检查与电视在同一 Wi-Fi 后重新扫码';
      }
    };

    /* T18 · FR-C8 重连入口：刷新页面（携地址栏滚动新码重新走配对） */
    reconnectBtn.addEventListener('click', function () { location.reload(); });

    /* T18 · PRD 第 7 章 disconnect 双向：页面关闭 / 刷新前 best-effort 通知电视（尽力发送，
       发送后连接即随页面卸载关闭）；不做任何持久化 */
    window.addEventListener('pagehide', function () {
      if (ws && ws.readyState === 1) {
        try { ws.send(JSON.stringify({ type: 'disconnect', reason: 'page-unload' })); } catch (e3) { /* 连接已不可用 */ }
      }
    });

    /* <390px 视口等比缩放兜底：360px 常见安卓视口下整卡缩放，不横向滚动、编辑卡不裁边
       （FR-C2「无滚动或最小滚动」最小实现；真实机型适配随 T19） */
    function fitStage() {
      var stage = document.querySelector('.stage');
      var scale = Math.min(1, document.documentElement.clientWidth / 390);
      stage.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    render();
  })();
  </script>
</body>
</html>
