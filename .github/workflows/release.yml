# Release：push v* tag 时构建并直发 GitHub Releases
#
# 口径（T100 拍板）：直发（draft 缺省 false）；发布正文取自 CHANGELOG.md
# 对应版本节（找不到即失败）；产物 unsigned，命名 sofatype-<版本>-unsigned.apk。
# 发版流程：先把 CHANGELOG.md「未发布」节改名为版本号并提交，再打 tag 推送。
# 版本号本身由工程内 versionName/versionCode 人工维护（决策 19），此处只做门禁。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建 + 发布 Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 配置 JDK 17（Zulu，与 flake 同发行版）
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: 门禁：tag 必须与 versionName 一致
        run: |
          set -euo pipefail
          gradle_ver=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d '"' -f2)
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "tag=${tag_ver}  versionName=${gradle_ver}"
          if [ "$tag_ver" != "$gradle_ver" ]; then
            echo "tag（${tag_ver}）与 versionName（${gradle_ver}）不一致，停止发布" >&2
            exit 1
          fi

      - name: 抽取 CHANGELOG 版本节作为发布说明
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '/^## /{insec=(index($0, ver) > 0)} insec{print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md 中找不到包含 ${ver} 的「## 」版本节；发版前须把「未发布」节改为版本号" >&2
            exit 1
          fi
          echo "---- 发布说明（release-notes.md）----"
          cat release-notes.md

      - name: 构建 release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: 复制产物为发布名
        run: cp app/build/outputs/apk/release/sofatype-release-unsigned.apk "sofatype-${GITHUB_REF_NAME#v}-unsigned.apk"

      - name: 发布到 GitHub Releases（直发）
        uses: softprops/action-gh-release@v3
        with:
          files: sofatype-*-unsigned.apk
          body_path: release-notes.md
          fail_on_unmatched_files: true
