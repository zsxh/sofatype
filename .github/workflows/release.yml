# Release：push v* tag 时构建、签名并直发 GitHub Releases
#
# 口径（T105 拍板，修订 T100「unsigned 直发」）：直发（draft 缺省 false）；发布正文取自 CHANGELOG.md
# 对应版本节（找不到即失败）；产物用发布专用 keystore 签名（GitHub Secrets 注入，缺 Secrets 立即失败），
# 命名 sofatype-<版本>.apk。发版流程：先把 CHANGELOG.md「未发布」节改名为版本号并提交，再打 tag 推送。
# 版本号本身由工程内 versionName/versionCode 人工维护（决策 19），此处只做门禁。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建 + 发布 Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 配置 JDK 17（Zulu，与 flake 同发行版）
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: 门禁：tag 必须与 versionName 一致
        run: |
          set -euo pipefail
          gradle_ver=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d '"' -f2)
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "tag=${tag_ver}  versionName=${gradle_ver}"
          if [ "$tag_ver" != "$gradle_ver" ]; then
            echo "tag（${tag_ver}）与 versionName（${gradle_ver}）不一致，停止发布" >&2
            exit 1
          fi

      - name: 抽取 CHANGELOG 版本节作为发布说明
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '/^## /{insec=(index($0, ver) > 0)} insec{print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md 中找不到包含 ${ver} 的「## 」版本节；发版前须把「未发布」节改为版本号" >&2
            exit 1
          fi
          echo "---- 发布说明（release-notes.md）----"
          cat release-notes.md

      - name: 还原发布签名 keystore（T105：缺 Secrets 立即失败，禁止 unsigned 直发）
        env:
          SOFATYPE_RELEASE_STORE_B64: ${{ secrets.SOFATYPE_RELEASE_STORE_B64 }}
          SOFATYPE_RELEASE_STORE_PASSWORD: ${{ secrets.SOFATYPE_RELEASE_STORE_PASSWORD }}
          SOFATYPE_RELEASE_KEY_ALIAS: ${{ secrets.SOFATYPE_RELEASE_KEY_ALIAS }}
          SOFATYPE_RELEASE_KEY_PASSWORD: ${{ secrets.SOFATYPE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SOFATYPE_RELEASE_STORE_B64}" ] || [ -z "${SOFATYPE_RELEASE_STORE_PASSWORD}" ] || \
             [ -z "${SOFATYPE_RELEASE_KEY_ALIAS}" ] || [ -z "${SOFATYPE_RELEASE_KEY_PASSWORD}" ]; then
            echo "::error::缺少发布签名 Secrets（SOFATYPE_RELEASE_STORE_B64 / _STORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD），拒绝发布 unsigned 产物" >&2
            exit 1
          fi
          echo "$SOFATYPE_RELEASE_STORE_B64" | base64 -d > "$RUNNER_TEMP/sofatype-release.keystore"
          {
            echo "SOFATYPE_RELEASE_STORE_FILE=$RUNNER_TEMP/sofatype-release.keystore"
            echo "SOFATYPE_RELEASE_STORE_PASSWORD=$SOFATYPE_RELEASE_STORE_PASSWORD"
            echo "SOFATYPE_RELEASE_KEY_ALIAS=$SOFATYPE_RELEASE_KEY_ALIAS"
            echo "SOFATYPE_RELEASE_KEY_PASSWORD=$SOFATYPE_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: 构建 release APK（签名经环境变量注入，见 app/build.gradle.kts）
        run: ./gradlew --no-daemon assembleRelease

      - name: 复制产物为发布名（签名产物缺文件即失败）
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/release/sofatype-release.apk || {
            echo "::error::签名产物 sofatype-release.apk 不存在，拒绝发布" >&2
            exit 1
          }
          cp app/build/outputs/apk/release/sofatype-release.apk "sofatype-${GITHUB_REF_NAME#v}.apk"

      - name: 发布到 GitHub Releases（直发，签名资产）
        uses: softprops/action-gh-release@v3
        with:
          files: sofatype-*.apk
          body_path: release-notes.md
          fail_on_unmatched_files: true
