name: wordpack

on:
  workflow_dispatch:
    inputs:
      version:
        description: "词包版本号（YYYYMMDD.N，留空自动取当日日期 .1）"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pypinyin
        run: pip install pypinyin

      - name: Build word pack
        run: |
          VERSION="${{ inputs.version }}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{8}\.[0-9]+$'; then
            VERSION="$(date +%Y%m%d).1"
          fi
          bash tools/wordpack/pipeline.sh "$VERSION" tools/wordpack/dist "热词包"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordpack-dist
          path: tools/wordpack/dist/
