<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>测试打字页（调试走查独立页）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#06080C}
button{font-family:inherit}
input{font-family:inherit}
input::placeholder{color:#7F848D}
</style>
</helmet>
<div style="width:1920px;height:1080px;position:relative;overflow:hidden;background:#06080C;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">

  <!-- 顶部页签 -->
  <div style="position:absolute;top:56px;left:96px;display:flex;align-items:center;gap:14px">
    <span style="font-size:20px;color:rgba(232,239,246,.4)">sofatype 输入法</span>
    <span style="width:1px;height:16px;background:rgba(255,255,255,.15)"></span>
    <span style="font-size:20px;color:#F2F6FB">测试打字</span>
  </div>

  <!-- 测试输入框 ×2（T77 双框表单，自设置页顶部调试区迁入；几何 = 实现 Token ×2：310dp 容器居中 / 48dp 框高 / 16dp 框距 / 10dp 圆角 / 12dp 内边距 / hint text_muted） -->
  <input aria-label="测试输入框，用于键盘与上屏验收" placeholder="测试输入框：用于键盘与上屏验收" style="box-sizing:border-box;position:absolute;top:300px;left:650px;width:620px;height:96px;background:#12161E;border:1.5px solid rgba(56,189,248,.4);border-radius:20px;padding:0 24px;font-size:30px;color:#E8EEF5;outline:none">
  <input aria-label="测试输入框 2，用于键盘与上屏验收" placeholder="测试输入框 2：用于键盘与上屏验收" style="box-sizing:border-box;position:absolute;top:428px;left:650px;width:620px;height:96px;background:#12161E;border:1.5px solid rgba(56,189,248,.4);border-radius:20px;padding:0 24px;font-size:30px;color:#E8EEF5;outline:none">

  <!-- 示例操作按钮（98×32dp · 间距 7dp · key 底中性描边，决策 44/47 口径随画布现行） -->
  <button style="all:unset;box-sizing:border-box;position:absolute;top:556px;left:757px;width:196px;height:64px;background:#1D242F;border:1px solid rgba(255,255,255,.06);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#E8EEF5;cursor:pointer">填入示例文本</button>
  <button style="all:unset;box-sizing:border-box;position:absolute;top:556px;left:967px;width:196px;height:64px;background:#1D242F;border:1px solid rgba(255,255,255,.06);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#E8EEF5;cursor:pointer">全选</button>

  <!-- 底部提示 -->
  <div style="position:absolute;top:830px;left:0;width:1920px;text-align:center;font-size:15px;color:rgba(232,239,246,.35)">调试走查页 · 由设置页「测试打字」进入</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
