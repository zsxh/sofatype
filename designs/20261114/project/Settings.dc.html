<x-dc>

<div style="width:1920px;height:1080px;position:relative;overflow:hidden;background:#06080C;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">

  <!-- 顶部页签 -->
  <div style="position:absolute;top:56px;left:96px;display:flex;align-items:center;gap:14px">
    <span style="font-size:20px;color:rgba(232,239,246,.4)">sofatype 输入法</span>
    <span style="width:1px;height:16px;background:rgba(255,255,255,.15)"></span>

  <div style="position:absolute;top:300px;left:0;width:1920px;display:flex;justify-content:center;align-items:center;gap:26px">

    <span style="font-size:72px;font-weight:700;color:#F2F6FB;letter-spacing:1px">sofatype</span>

  <div style="position:absolute;top:424px;left:0;width:1920px;text-align:center;font-size:18px;color:rgba(232,239,246,.5)">输入法 · 设置</div>

    <div style="position:absolute;top:0;left:0;width:620px;height:407px;box-sizing:border-box;padding:12px 36px">

      <div style="height:1px;background:rgba(255,255,255,.07)"></div>

        <span style="display:flex;align-items:center;gap:8px">
          <span style="width:7px;height:7px;border-radius:50%;background:#34D399"></span>
          <span style="font-size:16px;color:rgba(232,239,246,.55)">已是最新版本</span>
        </span>
      </div>
      <div style="height:1px;background:rgba(255,255,255,.07)"></div>
      <div style="display:flex;align-items:center;height:96px">

      <div style="height:1px;background:rgba(255,255,255,.07)"></div>

        <span style="display:flex;align-items:center;gap:8px;margin-left:auto">
          <span style="width:7px;height:7px;border-radius:50%;background:rgba(232,239,246,.35)"></span>
          <span style="font-size:16px;color:rgba(232,239,246,.55)">调试日志已关闭</span>

      </div>
